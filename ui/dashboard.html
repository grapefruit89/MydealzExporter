<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MyDealz AI Exporter</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#273347;--border:#334155;--accent:#22c55e;--accent2:#3b82f6;--danger:#ef4444;--warn:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--like:#3b82f6;--helpful:#f59e0b;--funny:#a855f7;--r:10px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Inter',system-ui,sans-serif}
/* Einspaltiges Cockpit: alles untereinander, feste Lesebreite */
.cockpit{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.cockpit-header{display:flex;align-items:flex-start;gap:12px}
.cockpit-header .brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cockpit-header .brand img{height:22px;width:22px;border-radius:6px}
.ai-badge-inline { height: 1.15em; width: 1.15em; vertical-align: -0.16em; display: inline-block; }
#meta-section{flex:1;min-width:0}
.meta-title{margin:0 0 8px;font-size:18px;font-weight:700;line-height:1.35}
.meta-facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.chip-price{color:var(--accent);border-color:#22c55e40;font-weight:700}
.chip-temp{color:var(--warn);border-color:#f59e0b40}
.deal-link{color:var(--accent2);font-size:13px;text-decoration:none}
.deal-link:hover{text-decoration:underline}
/* Nur im In-Page-Overlay (iframe) sichtbar: schließt das <dialog> auf der Deal-Seite */
.modal-close{display:none;margin-left:auto;flex-shrink:0;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;line-height:1;cursor:pointer;transition:.15s}
.modal-close:hover{border-color:var(--accent);color:var(--accent)}
body.mde-embedded .modal-close{display:inline-flex}
.section-title{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 8px;text-align:center}
.stat-card.author-card{border-color:#a1620740}
.stat-card.author-card .stat-num{color:#d97706}
.stat-num{font-size:20px;font-weight:800;color:var(--accent);line-height:1.2}
.stat-card.warn .stat-num{color:var(--warn)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.filter-notice { display: flex; align-items: flex-start; gap: 8px; background: rgba(37,99,235,.08); border-left: 3px solid #2563EB; border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.45; color: var(--text); margin-top: 12px; }
.filter-notice strong { color: #2563EB; }
.warn-note{margin:12px 0 0;padding:8px 12px;font-size:12px;color:var(--warn);background:#292106;border:1px solid #f59e0b40;border-radius:8px}
.prompt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ai-prompt-btn{padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;text-align:left;line-height:1.4;transition:.15s}
.ai-prompt-btn:hover:not(:disabled){background:#22c55e15;border-color:var(--accent);color:var(--accent)}
.ai-prompt-btn:disabled{opacity:.55;cursor:progress}
.custom-row{display:flex;gap:8px;margin-bottom:12px}
#custom-prompt{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;color:var(--text);font-size:13px}
#custom-prompt::placeholder{color:var(--muted)}
#custom-prompt:focus{outline:none;border-color:var(--accent2)}
.btn{padding:10px 18px;border:none;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#0f172a}
.btn-primary:hover{background:#16a34a}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--surface);border-color:var(--accent2);color:var(--accent2)}
.ai-output-wrap{position:relative}
#ai-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px 48px 16px 16px;min-height:180px;white-space:pre-wrap;font-size:14px;line-height:1.7}
#ai-copy-btn{position:absolute;top:8px;right:8px;font-size:11px;padding:5px 10px}
.export-grid-2x2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-export-cell{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;font-size:12px;font-weight:600;width:100%}
.export-attrib{margin-top:8px;font-size:10px;color:var(--muted);text-align:right}
.export-attrib a{color:var(--muted);text-decoration:none}
.export-attrib a:hover{color:var(--accent2)}
@media (max-width:620px){.cockpit{padding:14px}.prompt-grid{grid-template-columns:repeat(2,1fr)}.export-grid-2x2{grid-template-columns:1fr}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<main class="cockpit">
  <header class="card cockpit-header">
    <div id="meta-section">
      <div class="brand"><img src="icon48.png" alt=""> MyDealz <img src="ai-badge.svg" class="ai-badge-inline" alt="AI"> Exporter</div>
      <div class="meta-title">Lade Deal…</div>
    </div>
    <button class="modal-close" id="mde-close-btn" type="button" title="Schließen (Esc)" aria-label="Dashboard schließen">✕</button>
  </header>

  <section class="card">
    <h2 class="section-title" id="scan-title">📊 Deal-Scan</h2>
    <div id="stats-section"></div>
  </section>

  <section class="card ai-panel">
    <h2 class="section-title">🤖 KI-Analyse</h2>
    <div class="prompt-grid">
      <button class="ai-prompt-btn" data-prompt="summary">📋 Zusammenfassung</button>
      <button class="ai-prompt-btn" data-prompt="sentiment">📊 Stimmung</button>
      <button class="ai-prompt-btn" data-prompt="questions">❓ Offene Fragen</button>
      <button class="ai-prompt-btn" data-prompt="highlights">⭐ Beste Kommentare</button>
      <button class="ai-prompt-btn" data-prompt="problems">⚠️ Probleme</button>
      <button class="ai-prompt-btn" data-prompt="verdict">✅ Lohnt sich?</button>
    </div>
    <div class="custom-row">
      <input id="custom-prompt" type="text" placeholder="Eigene Frage an die KI…">
      <button class="btn btn-primary" id="btn-custom-ai">Fragen</button>
    </div>
    <div class="ai-output-wrap">
      <div id="ai-output">Wähle eine Analyse oben oder stelle eine eigene Frage.</div>
      <button class="btn btn-secondary" id="ai-copy-btn" title="Antwort kopieren">📋</button>
    </div>
  </section>

  <section class="card export-box">
    <h2 class="section-title">💾 Export</h2>
    <div class="export-grid-2x2">
      <button class="btn btn-secondary btn-export-cell" id="btn-export-json" type="button">💾 Download .json</button>
      <button class="btn btn-secondary btn-export-cell" id="btn-copy" type="button">📋 .json kopieren</button>
      <button class="btn btn-secondary btn-export-cell" id="btn-export-md" type="button">💾 Download .md</button>
      <button class="btn btn-secondary btn-export-cell" id="btn-copy-md" type="button">📋 .md kopieren</button>
    </div>
    <div class="export-attrib"><a href="https://www.magnific.com" target="_blank" rel="noopener noreferrer">designed by catalyststuff – Magnific.com</a></div>
  </section>
</main>
<script src="dashboard.js"></script>
</body>
</html>
