<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyDealz AI Exporter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F0F4F8;
      --surface: #FFFFFF;
      --surface2: #F8FAFC;
      --border: #E2E8F0;
      --text: #0F172A;
      --text2: #475569;
      --text3: #94A3B8;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: rgba(37,99,235,.08);
      --success: #16A34A;
      --warn: #D97706;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 48px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 860px;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 22px; }
    .brand { font-weight: 800; font-size: 16px; color: var(--text); }
    .brand span { color: var(--accent); }
    .deal-title {
      flex: 1;
      font-size: 13px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .03em;
    }
    .badge-info { background: var(--accent-soft); color: var(--accent); }
    .badge-ok   { background: #DCFCE7; color: var(--success); }
    .badge-warn { background: #FEF3C7; color: var(--warn); }

    /* ── CONTROL MATRIX ── */
    .matrix {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .cell {
      background: var(--surface2);
      padding: 16px 20px;
    }
    .cell-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text3);
      margin-bottom: 10px;
    }

    /* Segmented control */
    .seg { display: flex; gap: 4px; flex-wrap: wrap; }
    .seg button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .seg button:hover { border-color: var(--accent); color: var(--accent); }
    .seg button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* API + model row */
    .api-row { display: flex; gap: 8px; align-items: center; }
    .api-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      background: var(--surface);
    }
    .api-row input:focus { border-color: var(--accent); }
    .api-row select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      max-width: 160px;
    }
    .btn-run {
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-run:hover { background: var(--accent-hover); }
    .btn-run:disabled { opacity: .5; cursor: default; }

    /* Export bar */
    .export-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .fmt-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .fmt-toggle button {
      padding: 6px 14px;
      border: none;
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text2);
      transition: all .12s;
    }
    .fmt-toggle button.active { background: var(--accent); color: #fff; }
    .btn-icon {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text2);
      transition: all .15s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .token-pill {
      margin-left: auto;
      font-size: 11px;
      color: var(--text3);
    }

    /* Links cell */
    .links { display: flex; flex-direction: column; gap: 6px; }
    .links a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .links a:hover { text-decoration: underline; }

    /* ── EDITOR ── */
    .editor-wrap { position: relative; padding: 0; }
    #output {
      width: 100%;
      min-height: 340px;
      padding: 20px 24px;
      border: none;
      outline: none;
      resize: vertical;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.65;
      color: var(--text);
      background: var(--surface);
      display: block;
    }

    /* ── STATUS BAR ── */
    .statusbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      font-size: 11px;
      color: var(--text3);
    }
    #status-msg { flex: 1; }
    .spinner { display: none; }
    .spinner.active {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">🧠</div>
    <div>
      <div class="brand">MyDealz <span>AI</span> Exporter</div>
    </div>
    <div class="deal-title" id="deal-title">Lade Daten…</div>
    <span class="badge badge-info" id="comment-count">— Kommentare</span>
  </div>

  <!-- MATRIX -->
  <div class="matrix">
    <!-- Zelle 1: Prompt -->
    <div class="cell">
      <div class="cell-label">Prompt</div>
      <div class="seg" id="prompt-seg">
        <button class="active" data-idx="0">Zusammenfassung</button>
        <button data-idx="1">Top-Deals</button>
        <button data-idx="2">Kritisch</button>
        <button data-idx="3">Q&amp;A</button>
        <button data-idx="4">Vollständig</button>
      </div>
    </div>

    <!-- Zelle 2: Gemini -->
    <div class="cell">
      <div class="cell-label">Gemini</div>
      <div class="api-row">
        <input type="password" id="api-key" placeholder="Gemini API Key (AIza…)">
        <select id="model-select">
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        </select>
        <button class="btn-run" id="btn-run">▶ Run</button>
      </div>
    </div>

    <!-- Zelle 3: Export -->
    <div class="cell">
      <div class="cell-label">Export</div>
      <div class="export-bar">
        <div class="fmt-toggle">
          <button class="active" id="fmt-md">MD</button>
          <button id="fmt-json">JSON</button>
        </div>
        <button class="btn-icon" id="btn-copy">📋 Kopieren</button>
        <button class="btn-icon" id="btn-save">💾 Speichern</button>
        <span class="token-pill" id="token-count">0 Tokens</span>
      </div>
    </div>

    <!-- Zelle 4: Links -->
    <div class="cell">
      <div class="cell-label">Links</div>
      <div class="links" id="deal-links">
        <a id="link-deal" href="#" target="_blank">🔗 Deal öffnen</a>
        <a href="https://aistudio.google.com/app/apikey" target="_blank">🔑 API Key holen</a>
        <a href="https://aistudio.google.com/prompts" target="_blank">💡 AI Studio</a>
      </div>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="editor-wrap">
    <textarea id="output" spellcheck="false" placeholder="Hier erscheinen die Kommentare oder die KI-Antwort…"></textarea>
  </div>

  <!-- STATUS BAR -->
  <div class="statusbar">
    <div class="spinner" id="spinner"></div>
    <span id="status-msg">Bereit</span>
  </div>

</div>
<script src="dashboard.js"></script>
</body>
</html>
