<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MyDealz AI Exporter</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#273347;--border:#334155;--accent:#22c55e;--accent2:#3b82f6;--danger:#ef4444;--warn:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--like:#3b82f6;--helpful:#f59e0b;--funny:#a855f7;--r:10px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Inter',system-ui,sans-serif}
.shell{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px}
.topbar h1{margin:0;font-size:18px;font-weight:700;color:var(--accent)}
.pill{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:380px 1fr;overflow:hidden}
.left-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.meta-card{padding:16px;border-bottom:1px solid var(--border)}
.meta-card h2{margin:0 0 8px;font-size:15px;line-height:1.4}
.meta-card .deal-link{color:var(--accent2);font-size:13px;text-decoration:none}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px;border-bottom:1px solid var(--border)}
.stat-card{background:var(--surface2);border-radius:var(--r);padding:8px;text-align:center;border:1px solid transparent}
.stat-card[data-filter]{cursor:pointer;transition:.15s}
.stat-card[data-filter]:hover{filter:brightness(1.25);border-color:var(--border)}
.stat-card.active-filter{border-color:var(--accent)!important;background:#22c55e18}
.stat-card.active-filter .stat-num{color:var(--accent)}
.stat-card.warn{border-color:var(--warn)}
.stat-num{font-size:20px;font-weight:800;color:var(--accent)}
.stat-card.warn .stat-num{color:var(--warn)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.warn-note{margin:0;padding:8px 12px;font-size:12px;color:var(--warn);background:#292106;border-top:1px solid #f59e0b40}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:none;border-bottom:2px solid transparent;transition:.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.sort-bar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-shrink:0}
.sort-btn{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer}
.sort-btn.active{background:#22c55e20;border-color:var(--accent);color:var(--accent)}
.comments-wrap{overflow-y:auto;flex:1}
.comment-card{padding:10px 14px;border-bottom:1px solid #ffffff08}
.comment-card:hover{background:#ffffff04}
.reply-card{margin-left:18px;border-left:3px solid #3b82f630;padding-left:12px}
.comment-header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.comment-author{font-weight:700;font-size:12px;color:var(--accent2)}
.comment-date{font-size:11px;color:var(--muted)}
.comment-text{font-size:13px;line-height:1.5;white-space:pre-wrap}
.comment-text.deleted{color:var(--muted);font-style:italic}
.badge{border-radius:999px;padding:2px 7px;font-size:10px;font-weight:700}
.badge-del{background:#ef444420;color:var(--danger)}
.badge-hot{background:#f59e0b20;color:var(--warn)}
.badge-hidden{background:#a855f720;color:#a855f7}
.badge-score{background:#22c55e15;color:var(--accent)}
.reactions{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.reaction{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600}
.reaction-like{background:#3b82f620;color:var(--like)}
.reaction-helpful{background:#f59e0b20;color:var(--helpful)}
.reaction-funny{background:#a855f720;color:var(--funny)}
.right-panel{display:flex;flex-direction:column;overflow:hidden}
.ai-panel{flex:1;overflow-y:auto;padding:20px}
.ai-panel h3{margin:0 0 16px;font-size:16px;font-weight:700}
.prompt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.ai-prompt-btn{padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;line-height:1.4}
.ai-prompt-btn:hover{background:#22c55e15;border-color:var(--accent);color:var(--accent)}
.custom-row{display:flex;gap:8px;margin-bottom:16px}
#custom-prompt{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;color:var(--text);font-size:13px}
#custom-prompt::placeholder{color:var(--muted)}
#custom-prompt:focus{outline:none;border-color:var(--accent2)}
.btn{padding:10px 18px;border:none;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#0f172a}
.btn-primary:hover{background:#16a34a}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--accent2);color:var(--accent2)}
.ai-output-wrap{position:relative}
#ai-output{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;min-height:200px;white-space:pre-wrap;font-size:14px;line-height:1.7}
#ai-copy-btn{position:absolute;top:8px;right:8px;font-size:11px;padding:5px 10px}
.export-row{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <h1><img src="../icons/icon48.png" style="height:28px;width:28px;vertical-align:middle;margin-right:8px;border-radius:6px"> MyDealz AI Exporter</h1>
    <span class="pill" id="topbar-info">Lade...</span>
  </div>
  <div class="main">
    <div class="left-panel">
      <div id="meta-section"></div>
      <div id="stats-section"></div>
      <div class="tabs">
        <button class="tab active" data-tab="all">Alle</button>
        <button class="tab" data-tab="hot">🔥 Wichtig (Score≥3)</button>
        <button class="tab" data-tab="top">👍 Mit Reaktionen</button>
      </div>
      <div class="sort-bar">
        Sortieren:
        <button class="sort-btn active" data-sort="default">Zeitlich</button>
        <button class="sort-btn" data-sort="score">Score ↓</button>
        <button class="sort-btn" data-sort="replies">Replies ↓</button>
      </div>
      <div class="comments-wrap" id="comments-section"></div>
    </div>
    <div class="right-panel">
      <div class="ai-panel">
        <h3>🤖 KI-Analyse</h3>
        <div class="prompt-grid">
          <button class="ai-prompt-btn" data-prompt="summary">📋 Deal-Zusammenfassung</button>
          <button class="ai-prompt-btn" data-prompt="sentiment">📊 Stimmungsanalyse</button>
          <button class="ai-prompt-btn" data-prompt="questions">❓ Offene Fragen</button>
          <button class="ai-prompt-btn" data-prompt="highlights">⭐ Beste Kommentare</button>
          <button class="ai-prompt-btn" data-prompt="problems">⚠️ Probleme &amp; Warnungen</button>
          <button class="ai-prompt-btn" data-prompt="verdict">✅ Lohnt sich der Deal?</button>
        </div>
        <div class="custom-row">
          <input id="custom-prompt" type="text" placeholder="Eigene Frage an die KI...">
          <button class="btn btn-primary" id="btn-custom-ai">Fragen</button>
        </div>
        <div class="ai-output-wrap">
          <div id="ai-output">Waehle eine Analyse oben oder stelle eine eigene Frage.</div>
          <button class="btn btn-secondary" id="ai-copy-btn">📋</button>
        </div>
      </div>
      <div class="export-row">
        <button class="btn btn-secondary" id="btn-export-json">⬇ JSON</button>
        <button class="btn btn-secondary" id="btn-export-md">⬇ Markdown</button>
        <button class="btn btn-secondary" id="btn-copy">📋 JSON kopieren</button>
        <span style="margin-left:auto;font-size:10px;color:var(--muted);align-self:center;white-space:nowrap"><a href="https://www.magnific.com" target="_blank" style="color:var(--muted);text-decoration:none">designed by catalyststuff – Magnific.com</a></span>
      </div>
    </div>
  </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
