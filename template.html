<div class="header">
    <h2>💎 MyDealz Analyzer <span class="badge">v13.0</span></h2>
    <div style="display:flex; gap:10px">
            <button class="btn" id="settingsBtn" title="API Key verwalten">⚙️ API Key</button>
    </div>
</div>

<div class="meta-bar">
    <div class="meta-item"><b>Deal:</b> <span id="meta-title">...</span></div>
    <div class="meta-item"><b>Status:</b> <span id="meta-status">...</span> (<span id="meta-age">...</span>)</div>
    <div class="meta-item"><b>Preis:</b> <span id="meta-price">...</span></div>
    <div class="meta-item"><b>Count:</b> <span id="meta-count">...</span></div>
    <div class="meta-item cache-info" id="meta-cache" style="display:none">⚡ Cached <span id="meta-cache-time"></span></div>
</div>

<div class="controls-area">
    
    <!-- Row 1: Prompts & Gemini Analysis -->
    <div style="display: flex; align-items: flex-end; gap: 20px;">
        <div>
                <div class="group-label">Prompts</div>
                <div class="tabs" id="tabContainer"></div>
        </div>
        <div id="geminiContainer" style="margin-bottom: 0;">
                <!-- Rendered via JS -->
        </div>
    </div>
    
    <!-- Row 2: Export & External Tools -->
    <div class="action-row" style="margin-top: 12px; display: flex; justify-content: space-between; gap: 20px;">
            <div>
            <div class="group-label">Exportieren</div>
            <div class="btn-row">
                <button class="btn" id="copyBtn">📋 Copy</button>
                <button class="btn btn-primary" id="saveMd">💾 .MD</button>
                <button class="btn" id="saveJson">💾 .JSON</button>
                <button class="btn" id="refreshBtn" title="Cache löschen & Neu laden">🔄 Neu laden</button>
            </div>
        </div>
        <div>
            <div class="group-label">External AI Tools</div>
            <div class="btn-row" id="external-tools">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>
</div>

<div class="main">
        <div id="aiOutput" style="display:none"></div>
        <textarea id="output" readonly></textarea>
</div>
<div id="toast" class="toast"></div>
