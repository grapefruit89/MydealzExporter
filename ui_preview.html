<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MyDealz AI Exporter</title>
    <style>
        /* 
           MODERN SAAS THEME (Vercel-inspired)
           - Light colors, soft shadows, thin borders.
           - Font: Inter/System stack.
        */
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --bg-body: #F8FAFC;       /* Very light slate */
            --bg-surface: #FFFFFF;
            --border: #E2E8F0;        /* Thin subtle border */
            --text-main: #0F172A;     /* Dark slate for headings */
            --text-muted: #64748B;    /* Muted slate for labels */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-card: 12px;
            --radius-elem: 8px;
            --input-height: 36px;     /* Slightly taller for modern feel */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CARD CONTAINER */
        .app-card {
            background: var(--bg-surface);
            width: 800px;
            height: 650px;
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
        }

        .brand {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CONTROL MATRIX */
        .control-matrix {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 32px;
            background: #FFFFFF; /* Pure white surface */
            border-bottom: 1px solid var(--border);
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .group-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* SEGMENTED CONTROL (Floating Tab Style) */
        .segmented-control {
            display: inline-flex;
            background: #F1F5F9; /* Light gray track */
            padding: 3px;
            border-radius: var(--radius-elem);
            height: var(--input-height);
            border: 1px solid transparent; /* No border for track */
        }

        .segment-btn {
            flex: 1;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .segment-btn:hover {
            color: var(--text-main);
        }

        .segment-btn.active {
            background: white;
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08); /* Float effect */
        }

        /* GEMINI INPUT (Merged Seamless) */
        .input-group {
            display: flex;
            height: var(--input-height);
            border: 1px solid var(--border);
            border-radius: var(--radius-elem);
            background: white;
            overflow: hidden;
            width: 100%;
            max-width: 280px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); /* Ring effect */
        }

        .input-field {
            flex: 1;
            border: none;
            padding: 0 12px;
            font-size: 13px;
            font-family: monospace;
            outline: none;
            color: var(--text-main);
            background: transparent;
        }
        
        .input-field::placeholder { color: #94A3B8; }

        .input-action {
            width: 36px;
            border: none;
            border-left: 1px solid var(--border);
            background: #FAFAFA;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
            transition: background 0.1s;
        }

        .input-action:hover {
            background: #F1F5F9;
            color: var(--text-main);
        }

        /* BUTTONS */
        .export-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            height: var(--input-height);
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-elem);
            background: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(0); }
        
        .btn-primary {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        /* AI LINKS */
        .ai-links {
            display: flex;
            gap: 10px;
        }

        /* EDITOR AREA */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white; /* Clean white */
            position: relative;
        }

        .editor-header {
            padding: 8px 24px;
            border-bottom: 1px solid var(--border);
            background: #FAFAFA; /* Subtle header bg */
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            height: 3px;
            width: 100%;
            background: transparent;
        }
        .progress-fill {
            height: 100%;
            width: 0%; 
            background: linear-gradient(90deg, #22C55E, #EAB308, #EF4444);
            transition: width 0.3s;
        }

        .code-block {
            flex: 1;
            padding: 24px;
            border: none;
            resize: none;
            outline: none;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            background: white;
        }

        /* Scrollbar aesthetics */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
        
    </style>
</head>
<body>

    <div class="app-card">
        <!-- Progress Bar at very top of card or below header? 
             Previous design had it at top of card. Keeping it there but making it subtle. -->
        <div class="progress-bar"><div class="progress-fill" id="pBar" style="width: 0%"></div></div>

        <!-- Header -->
        <header>
            <div class="brand">🧠 MyDealz AI Exporter <span style="font-weight:400; color:#94A3B8; margin-left:6px;">v14.0</span></div>
        </header>

        <!-- 2x2 Matrix -->
        <div class="control-matrix">
            
            <!-- 1. Prompts -->
            <div class="grid-item">
                <div class="group-label">PROMPTS</div>
                <div class="segmented-control" id="promptContainer">
                    <button class="segment-btn">Keine</button>
                    <button class="segment-btn">Kurz</button>
                    <button class="segment-btn active">Standard</button>
                    <button class="segment-btn">Lang</button>
                </div>
            </div>

            <!-- 2. Gemini AI -->
            <div class="grid-item">
                <div class="group-label">GEMINI AI</div>
                <div class="input-group">
                    <input type="password" id="apiKeyInput" class="input-field" placeholder="API Key einfügen...">
                    <select id="modelSelect" style="display:none"></select>
                    <button class="input-action">➔</button>
                </div>
            </div>

            <!-- 3. Export -->
            <div class="grid-item" style="align-self: end;">
                <div class="group-label">EXPORT</div>
                <div class="export-bar">
                    <div class="segmented-control" id="formatToggle">
                        <button class="segment-btn active">.MD</button>
                        <button class="segment-btn">.JSON</button>
                    </div>
                    <button class="btn" id="btnCopy">📋 Copy</button>
                    <button class="btn btn-primary" id="btnSave">💾 Save</button>
                </div>
            </div>

            <!-- 4. AI Links -->
            <div class="grid-item" style="align-self: end;">
                <div class="group-label">AI LINKS</div>
                <div class="ai-links">
                    <button class="btn">Studio</button>
                    <button class="btn">GPT</button>
                    <button class="btn">Grok</button>
                    <button class="btn">Claude</button>
                </div>
            </div>
        </div>

        <!-- Editor (White Mode) -->
        <div class="editor-area">
            <div class="editor-header">
                <span>Output Preview</span>
                <span id="tokenStatus">0 Tokens</span>
            </div>
            <textarea class="code-block" id="editor" spellcheck="false" placeholder="Waiting for data..."></textarea>
        </div>

    </div>

</body>
</html>
